<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>¿Quieres ser mi San Valentín?</title>
<style>
  body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family: 'Segoe UI', sans-serif;
    text-align:center;
    color:#fff;
    overflow:hidden;
  }
  .card{
    background:rgba(255,255,255,0.15);
    padding:40px;
    border-radius:25px;
    backdrop-filter:blur(10px);
    box-shadow:0 15px 35px rgba(0,0,0,.2);
    max-width:400px;
    position:relative;
  }
  h1{font-size:28px;margin-bottom:10px}
  p{font-size:18px;margin-bottom:25px}
  .btns{display:flex;gap:20px;justify-content:center}
  button{
    border:none;
    padding:12px 25px;
    font-size:18px;
    border-radius:50px;
    cursor:pointer;
    transition:.25s;
    position:relative;
  }
  #yes{background:#ff4b7d;color:white}
  #yes:hover{transform:scale(1.1);background:#ff1e5f}
  #no{background:white;color:#ff4b7d}
  .success{
    font-size:26px;
    animation:fade .6s ease forwards;
  }
  @keyframes fade{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
  }
</style>
</head>
<body>
  <div class="card" id="box">
    <h1>💖 Shir ❤️ ¿Quieres ser mi San Valentín? 💖</h1>
    <p>Cris tiene una pregunta muy importante para ti…</p>
    <div class="btns">
      <button id="yes">Sí 💘</button>
      <button id="no">No 🙈</button>
    </div>
  </div>
<script>
const noBtn=document.getElementById('no');
const card=document.querySelector('.card');

function moverBoton(){
  const cardRect=card.getBoundingClientRect();
  const btnRect=noBtn.getBoundingClientRect();

  const maxX=cardRect.width-btnRect.width-20;
  const maxY=cardRect.height-btnRect.height-20;

  const x=Math.random()*maxX - (cardRect.width/4);
  const y=Math.random()*maxY - (cardRect.height/4);

  noBtn.style.transform=`translate(${x}px,${y}px)`;
}

// PC
noBtn.addEventListener('mouseenter',moverBoton);
noBtn.addEventListener('mouseover',moverBoton);
noBtn.addEventListener('click',e=>{e.preventDefault(); moverBoton();});

// Celular (táctil)
noBtn.addEventListener('touchstart',(e)=>{
  e.preventDefault();
  moverBoton();
});

document.getElementById('yes').onclick=()=>{
  window.location.href = 'si.html';
}
</script>
</body>
</html>
